<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Mini App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1 class="small-caps">LUDO CHAMPION</h1>
            <div id="user-info">Loading...</div>
        </header>
        
        <div id="game-container">
            <!-- The Ludo Board will be rendered here -->
            <canvas id="ludo-board" width="400" height="400"></canvas>
        </div>

        <div id="controls">
            <button id="roll-dice-btn" class="btn primary">ROLL DICE</button>
            <div id="dice-result" class="small-caps">-</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
